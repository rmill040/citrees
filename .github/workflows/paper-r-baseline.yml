name: Paper R Baseline

on:
  workflow_dispatch:

jobs:
  r-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build candidate benchmark image
        run: |
          mkdir -p "$RUNNER_TEMP/citrees-build-context"
          git archive --format=tar HEAD |
            tar -xf - -C "$RUNNER_TEMP/citrees-build-context"
          docker build \
            --build-arg "SOURCE_GIT_SHA=$GITHUB_SHA" \
            --file "$RUNNER_TEMP/citrees-build-context/paper/benchmark/infra/docker/Dockerfile" \
            --tag citrees-r-baseline:candidate \
            "$RUNNER_TEMP/citrees-build-context"

      - name: Verify frozen runtime
        run: |
          test \
            "$(docker inspect --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}' citrees-r-baseline:candidate)" \
            = "$GITHUB_SHA"
          docker run --rm citrees-r-baseline:candidate \
            R --vanilla --slave -e \
            'stopifnot(as.character(getRversion()) == "4.5.2"); stopifnot(as.character(packageVersion("partykit")) == "1.2.24")'
          docker run --rm -i citrees-r-baseline:candidate python - <<'PY'
          import platform
          from importlib.metadata import version
          from paper.benchmark.pipeline.r_methods import _get_partykit
          from paper.benchmark.utils.env import get_library_versions

          assert platform.python_version() == "3.12.7"
          assert version("rpy2") == "3.6.7"
          assert version("scikit-learn") == "1.8.0"
          assert get_library_versions()["rpy2"] == "3.6.7"
          _get_partykit()
          PY

      - name: Run benchmark tests in candidate image
        run: |
          docker run --rm citrees-r-baseline:candidate \
            pytest tests/paper/test_stage1.py tests/paper/test_provenance.py -q -rs
